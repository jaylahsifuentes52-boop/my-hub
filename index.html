<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAS Clan</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#090b14,#17132b,#071d24);
  color:white;
}
.card{
  width:min(900px,92%);
  padding:48px 28px;
  text-align:center;
  border:1px solid rgba(255,255,255,.15);
  border-radius:28px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}
h1{font-size:clamp(42px,8vw,78px);margin:0 0 10px}
p{font-size:18px;color:#cfd3df;margin:0 auto 35px;max-width:620px}
.links{display:grid;gap:18px;max-width:560px;margin:auto}
a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:64px;
  padding:16px 22px;
  border-radius:16px;
  text-decoration:none;
  color:white;
  font-size:19px;
  font-weight:700;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.16);
  transition:.2s transform,.2s background;
}
a:hover{transform:translateY(-3px);background:rgba(255,255,255,.2)}
.discord{background:#5865F2}
.discord:hover{background:#4752c4}
.youtube{background:#ff0000}
.youtube:hover{background:#cc0000}
footer{margin-top:32px;color:#8f96a8;font-size:14px}
</style>
</head>
<body>
<main class="card">
  <h1>AAS Clan</h1>
  <p>Welcome to the AAS Clan community. Join the Discord and check out my YouTube channel.</p>

  <div class="links">
    <a class="discord" href="https://discord.gg/2vpZntsZUg" target="_blank" rel="noopener noreferrer">
      💬 My AAS Clan — Discord
    </a>
    <a class="youtube" href="https://www.youtube.com/@Redgorilla-f7r" target="_blank" rel="noopener noreferrer">
      ▶️ My YouTube — Redgorilla
    </a>
  </div>

  <footer>© 2026 AAS Clan</footer>
</main>
</body>
</html>
